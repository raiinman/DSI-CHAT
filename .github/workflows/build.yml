name: DSI CHAT builds
on:
  push:
    branches: [rewrite, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run catalog
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: dsi-chat-builds
          path: release/
          if-no-files-found: error
