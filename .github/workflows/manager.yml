name: DSI Manager verification
on:
  push:
    branches: [codex/dsi-original, codex/dsi-manager-review]
    paths: ['android/**', '.github/workflows/manager.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Prepare Android SDK and pinned patch tool
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --install "platforms;android-35" "build-tools;35.0.1"
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
          node android/setup.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patch tool verification failed' }
      - name: Check strict Manager preflight
        run: node --test android/manager-qa-preflight.test.mjs
      - name: Build normal Manager and controlled HTTPS update fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/manager-https-qa | Out-Null
          $taskOpenSsl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (!$taskOpenSsl) { $taskOpenSsl = 'C:/Program Files/Git/usr/bin/openssl.exe' }
          & $taskOpenSsl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout .cache/manager-https-qa/server.key -out .cache/manager-https-qa/server.crt -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          if ($LASTEXITCODE -ne 0) { throw 'Controlled TLS fixture generation failed' }
          ./android/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
          ./android/manager/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
          Copy-Item dist/android/dsi-manager-demo-debug.apk dist/android/manager-production-demo.apk
          ./android/manager/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -QaCertificate .cache/manager-https-qa/server.crt
          Copy-Item dist/android/dsi-manager-demo-debug.apk dist/android/manager-qa-demo.apk
          ./android/manager/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -VersionCode 2 -VersionName '0.3.0-qa.2' -OutputName 'dsi-manager-update-fixture.apk'
          & "$env:JAVA_HOME/bin/keytool.exe" -genkeypair -keystore .cache/manager-https-qa/other-signer.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=DSI QA Other Signer'
          if ($LASTEXITCODE -ne 0) { throw 'Controlled signer fixture generation failed' }
          ./android/manager/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -VersionCode 2 -VersionName '0.3.0-qa.2' -OutputName 'dsi-manager-other-signer-fixture.apk' -SigningKey .cache/manager-https-qa/other-signer.keystore
          Copy-Item .cache/manager-https-qa/server.crt dist/android/manager-qa-server.crt
          Copy-Item .cache/manager-https-qa/server.key dist/android/manager-qa-server.key
      - uses: actions/upload-artifact@v4
        with:
          name: dsi-manager-controlled-build
          path: |
            dist/android/*manager*.apk
            dist/android/*manager*.json
            dist/android/manager-qa-server.crt
            dist/android/manager-qa-server.key
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsi-manager-controlled-build
          path: dist/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            node android/manager-qa.mjs --manager-apk dist/android/dsi-manager-qa-debug.apk --fixture-apk dist/android/manager-qa-demo.apk --report dist/android/manager-qa-build-report.json --update-apk dist/android/dsi-manager-update-fixture.apk --update-report dist/android/dsi-manager-update-fixture-report.json --bad-signer-apk dist/android/dsi-manager-other-signer-fixture.apk --bad-signer-report dist/android/dsi-manager-other-signer-fixture-report.json --tls-cert dist/android/manager-qa-server.crt --tls-key dist/android/manager-qa-server.key --output .cache/android-manager-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-manager-rendered-evidence
          path: .cache/android-manager-evidence/
