name: DSI platform verification
on:
  push:
    branches: [codex/dsi-original, codex/dsi-platform-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix desktop --ignore-scripts
      - run: node desktop/node_modules/electron/install.js
      - run: node --test workbench/*.test.mjs
      - run: node desktop/smoke.mjs
      - run: node desktop/package.mjs
      - run: node desktop/smoke.mjs --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-windows-evidence
          include-hidden-files: true
          path: |
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: dsi-windows-portable
          path: release/dsi-chat-windows-portable/
  android-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install native SDK requirements
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --install "platforms;android-35" "build-tools;35.0.1"
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
      - run: node android/setup.mjs
      - run: ./android/test.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/build.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/build-bootstrap.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/build-split-fixture.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/patch-test.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/set-test.ps1 -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/export-test.ps1
      - run: node --test android/qa-preflight.test.mjs
      - run: ./android/patch-apk.ps1 -InputApk dist/android/dsi-native-lab-debug.apk -OutputApk dist/android/dsi-native-lab-patched-debug.apk -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - run: ./android/patch-set.ps1 -InputDirectory dist/android/split-fixture -OutputDirectory dist/android/split-fixture-patched -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: dsi-android-development
          path: dist/android/
  android-emulator:
    needs: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsi-android-development
          path: dist/android
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            node android/emulator-qa.mjs --apk dist/android/dsi-native-lab-patched-debug.apk --output .cache/android-emulator-evidence/monolithic
            node android/emulator-qa.mjs --apk-set dist/android/split-fixture-patched --output .cache/android-emulator-evidence/splits
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-android-emulator-evidence
          path: .cache/android-emulator-evidence/
