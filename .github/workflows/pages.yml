name: DSI CHAT live preview
on:
  push:
    branches: [codex/dsi-original]
  workflow_dispatch:
    inputs:
      review_only:
        description: Build screenshots without publishing
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dsi-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.review_only && 'dsi-visual-review' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run catalog
      - run: git diff --exit-code catalog/features.json
      - run: npm run build
      - run: node scripts/site.mjs
      - name: Install browser QA tooling
        run: |
          npm install --prefix .cache/browser-qa --no-save --ignore-scripts playwright@1.58.2
          node .cache/browser-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser usability checks
        run: node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-messenger-screenshots
          path: .cache/screenshots
      - run: cd dist/chromium && zip -r ../site/downloads/dsi-chat-original-chromium.zip . && sha256sum -c SHA256SUMS
      - uses: actions/configure-pages@v5
        if: inputs.review_only != true
      - uses: actions/upload-pages-artifact@v3
        if: inputs.review_only != true
        with:
          path: dist/site
      - name: Deploy
        if: inputs.review_only != true
        id: deployment
        uses: actions/deploy-pages@v4
