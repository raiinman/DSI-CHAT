<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose what to share</title><link rel="stylesheet" href="picker.css"></head>
<body><header><span class="brand">DSI CHAT</span><h1>Choose what to share</h1><p>Select one window or your entire screen. Sharing starts only after you choose Share.</p></header>
<main><div class="filters" aria-label="Source filters"><button id="all" aria-pressed="true">All sources</button><button id="screens" aria-pressed="false">Screens</button><button id="windows" aria-pressed="false">Windows</button><button id="refresh">Refresh</button></div><p id="status" role="status">Loading available sources…</p><div id="sources" class="sources" aria-label="Available screens and windows"></div></main>
<footer><label id="audio-row"><input id="audio" type="checkbox" disabled> Include computer sound <span>Available for an entire screen on Windows.</span></label><div class="actions"><span id="selection">No source selected</span><button id="cancel">Cancel</button><button id="share" disabled>Share selected source</button></div></footer><script type="module" src="picker.mjs"></script></body></html>
